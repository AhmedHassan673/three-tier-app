version: "3.8"

services:
  # ---------- TIER 1: Frontend (Nginx serving static HTML/JS) ----------
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-net

  # ---------- TIER 2: Backend (Node.js/Express REST API) ----------
  backend:
    build: ./backend
    container_name: backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=taskdb
      - PORT=5000
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - app-net

  # ---------- TIER 3: Database (PostgreSQL) ----------
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taskdb
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - app-net

volumes:
  db_data:

networks:
  app-net:
    driver: bridge
