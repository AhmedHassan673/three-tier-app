<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3-Tier DevOps Demo - Task Manager</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    margin: 0;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
  .architecture {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    font-size: 11px;
  }
  .architecture span {
    background: #334155;
    padding: 4px 10px;
    border-radius: 999px;
    color: #93c5fd;
  }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
  }
  button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #2563eb; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0f172a;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  li.done span.title { text-decoration: line-through; color: #64748b; }
  .task-left { display: flex; align-items: center; gap: 10px; }
  .del-btn {
    background: transparent;
    color: #f87171;
    padding: 4px 8px;
    font-size: 16px;
  }
  .del-btn:hover { background: #331414; }
  #status { font-size: 12px; color: #64748b; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1>📋 My Updated Task Manager</h1>
    <div class="subtitle">3-Tier Dockerized Demo App</div>
    <div class="architecture">
      <span>Nginx (Frontend)</span>
      <span>Node/Express (Backend)</span>
      <span>PostgreSQL (DB)</span>
    </div>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Add a new task..." required />
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>
    <div id="status">Loading tasks...</div>
  </div>

<script>
  const API_BASE = "/api";

  const form = document.getElementById("task-form");
  const input = document.getElementById("task-input");
  const list = document.getElementById("task-list");
  const status = document.getElementById("status");

  async function fetchTasks() {
    try {
      const res = await fetch(`${API_BASE}/tasks`);
      if (!res.ok) throw new Error("Bad response");
      const tasks = await res.json();
      renderTasks(tasks);
      status.textContent = `Connected to backend • ${tasks.length} task(s)`;
    } catch (err) {
      status.textContent = "⚠️ Could not reach backend API";
    }
  }

  function renderTasks(tasks) {
    list.innerHTML = "";
    tasks.forEach((task) => {
      const li = document.createElement("li");
      if (task.is_done) li.classList.add("done");

      const left = document.createElement("div");
      left.className = "task-left";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.is_done;
      checkbox.addEventListener("change", () => toggleTask(task.id));

      const titleSpan = document.createElement("span");
      titleSpan.className = "title";
      titleSpan.textContent = task.title;

      left.appendChild(checkbox);
      left.appendChild(titleSpan);

      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", () => deleteTask(task.id));

      li.appendChild(left);
      li.appendChild(delBtn);
      list.appendChild(li);
    });
  }

  async function toggleTask(id) {
    await fetch(`${API_BASE}/tasks/${id}`, { method: "PUT" });
    fetchTasks();
  }

  async function deleteTask(id) {
    await fetch(`${API_BASE}/tasks/${id}`, { method: "DELETE" });
    fetchTasks();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = input.value.trim();
    if (!title) return;
    await fetch(`${API_BASE}/tasks`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title }),
    });
    input.value = "";
    fetchTasks();
  });

  fetchTasks();
  setInterval(fetchTasks, 5000);
</script>
</body>
</html>
